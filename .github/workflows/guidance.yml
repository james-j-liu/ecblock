name: Read guidance (re-code)

# Re-reads core members' and the Council's documents with the live decision model
# (scripts/code_guidance.py) and commits the guidance caches back to the branch. The
# daily run reads new documents itself; this is for re-reading after a model or prompt
# change, on claude/** branches or by hand.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths:
      - "src/ecblock/policy/guidance.py"
      - "scripts/code_guidance.py"
      - ".github/workflows/guidance.yml"

permissions:
  contents: write

concurrency:
  group: guidance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read documents
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u scripts/code_guidance.py
      - name: Commit caches
        if: always()
        run: |
          git config user.name "ecblock-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/guidance.jsonl data/processed/guidance_council.jsonl
          git commit -m "read guidance $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
